<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../../fonts/ibm-plex-mono-latin.woff2") format("woff2"); }
  html, body { margin: 0; background: #131612; }
  svg { display: block; }
  text { font-family: "IBM Plex Mono", monospace; }
</style>
</head>
<body>
<!-- easy-cheese tile image, 1440x1080. The README's "Suggested flow" diagram,
     redrawn: /cheese routes every input onto one track that ends in a
     reviewed pull request. Palette and limits from AGENTS.md. -->
<svg width="1440" height="1080" viewBox="0 0 1440 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="2" fill="#d7e6db" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="flame" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db7300" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#db7300" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#db7300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="1080" fill="#131612"/>
  <rect width="1440" height="1080" fill="url(#dots)"/>

  <!-- the prompt: the only words, 110px so they read at the 168px slot -->
  <text x="132" y="268" font-size="112" fill="#7a877e">›</text>
  <text x="236" y="268" font-size="112" fill="#d7e6db">/cheese it</text>
  <rect x="908" y="178" width="58" height="104" fill="#7a877e" fill-opacity="0.55"/>

  <!-- the prompt drops into the router -->
  <path d="M 196 330 V 556" stroke="#7a877e" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- side routes: each leaves the router and either rejoins the track or stops -->
  <g stroke="#7a877e" stroke-opacity="0.42" stroke-width="8" fill="none" stroke-linecap="round">
    <!-- bug: /pasteurize, then into /cook -->
    <path d="M 196 640 C 196 720, 250 740, 330 740 C 420 740, 470 700, 470 640"/>
    <!-- review only: /age -->
    <path d="M 196 640 C 196 820, 300 840, 520 840 C 690 840, 750 780, 750 640"/>
    <!-- PR comments / CI: /affinage, then /cure -->
    <path d="M 196 640 C 196 910, 360 930, 700 930 C 850 930, 890 820, 890 640"/>
    <!-- research, discussion, conflicts: stops -->
    <path d="M 196 470 C 196 420, 250 400, 330 400 H 470"/>
    <path d="M 196 470 C 196 440, 230 380, 196 330" stroke-opacity="0"/>
  </g>
  <g fill="#131612" stroke="#7a877e" stroke-opacity="0.6" stroke-width="8">
    <circle cx="330" cy="740" r="20"/>
    <circle cx="520" cy="840" r="20"/>
    <circle cx="700" cy="930" r="20"/>
    <circle cx="470" cy="400" r="20"/>
  </g>

  <!-- the main track: /mold /cook /press /age /cure /plate -->
  <path d="M 196 596 H 1090"stroke="#7a877e" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#7a877e" stroke="#131612" stroke-width="10">
    <rect x="300" y="566" width="60" height="60" rx="10"/>
    <rect x="440" y="566" width="60" height="60" rx="10"/>
    <rect x="580" y="566" width="60" height="60" rx="10"/>
    <rect x="720" y="566" width="60" height="60" rx="10"/>
    <rect x="860" y="566" width="60" height="60" rx="10"/>
    <rect x="1000" y="566" width="60" height="60" rx="10"/>
  </g>

  <!-- the router: /cheese -->
  <circle cx="196" cy="596" r="46" fill="#131612" stroke="#d7e6db" stroke-width="12"/>
  <circle cx="196" cy="596" r="14" fill="#d7e6db"/>

  <!-- out: the goal, a cheese wedge with a check in it, the one gold thing.
       Drawn in the palette gold rather than the system emoji's yellow. -->
  <circle cx="1196" cy="570" r="240" fill="url(#flame)"/>
  <g stroke="#131612" stroke-width="8" stroke-linejoin="round">
    <!-- top face: the rind side, a lighter gold -->
    <path d="M 1088 540 L 1304 540 L 1304 446 Z" fill="#f1c035"/>
    <path d="M 1088 540 L 1304 540 L 1304 446 Z" fill="#fff" fill-opacity="0.22" stroke="none"/>
    <!-- front face -->
    <rect x="1088" y="540" width="216" height="118" rx="10" fill="#f1c035"/>
  </g>
  <g fill="#131612">
    <circle cx="1118" cy="572" r="11"/>
    <circle cx="1276" cy="630" r="13"/>
    <circle cx="1124" cy="632" r="8"/>
    <circle cx="1270" cy="490" r="8"/>
  </g>
  <path d="M 1162 600 L 1186 624 L 1232 574" stroke="#131612" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</body>
</html>
