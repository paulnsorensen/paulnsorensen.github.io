<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>🧀</title>
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Paul Sorensen — projects">
  <meta name="theme-color" content="#0b0e0c">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Paul Sorensen — cheeselord.dev">
  <meta property="og:description" content="The cheese must flow.">
  <meta property="og:url" content="https://cheeselord.dev/">
  <meta property="og:image" content="https://cheeselord.dev/cheeselord-still.jpg">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-latin-variable.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ibm-plex-mono-latin.woff2" crossorigin>
  <!-- the shared shell first, this page's own additions second -->
  <link rel="stylesheet" href="styles/vendor/cheeselord.css">
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/">cheeselord<b>.dev</b></a>
    <a class="top" href="https://github.com/paulnsorensen">github</a>
  </div>
</header>
<main>

  <section class="wrap hero">
    <h1>The <em>cheese</em> must flow.</h1>
    <div class="ember-box">
      <video class="ember" width="320" height="320" autoplay muted loop playsinline
             poster="cheeselord-still.jpg" role="img" aria-label="The Cheese Lord: a block of cheese burning atop a runic sigil">
        <source src="cheeselord.webm" type="video/webm">
        <source src="cheeselord.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="wrap shelf" aria-label="Projects">
    <a class="tile" href="/easy-cheese">
      <figure class="shot">
        <img src="assets/shots/easy-cheese.png" alt="" onerror="this.parentNode.classList.add('empty')">
        <span class="ph">easy-cheese.png</span>
      </figure>
      <span class="name">easy-cheese</span>
      <h2>Idea in. Reviewed pull request out.</h2>
    </a>
    <a class="tile" href="/hallouminate">
      <figure class="shot">
        <img src="assets/shots/hallouminate.png" alt="" onerror="this.parentNode.classList.add('empty')">
        <span class="ph">hallouminate.png</span>
      </figure>
      <span class="name">hallouminate</span>
      <h2>A wiki your agent writes, then searches.</h2>
    </a>
    <a class="tile" href="https://github.com/paulnsorensen/milknado">
      <figure class="shot">
        <img src="assets/shots/milknado.png" alt="" onerror="this.parentNode.classList.add('empty')">
        <span class="ph">milknado.png</span>
      </figure>
      <span class="name">milknado</span>
      <h2>Big refactors, one prerequisite at a time.</h2>
    </a>
  </section>

  <p class="wrap also">
    <span>also aging</span>
    <a href="https://github.com/paulnsorensen/skillz-that-grillz">skillz-that-grillz</a>
    <a href="https://github.com/paulnsorensen/dotfiles">dotfiles</a>
  </p>

</main>
<footer>
  <div class="wrap"><span>milk in, wheels out 🧀</span><img class="signature" src="assets/signature.png" alt="" width="343" height="77"></div>
</footer>
<script>
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const v = document.querySelector("video");
    v.removeAttribute("autoplay");
    v.pause();
  }
</script>
</body>
</html>
